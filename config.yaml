# ============================================================================
# gelation-transfer — global configuration
# Every stage reads seeds, thresholds, CV settings, and paths from here so that
# nothing is hard-coded in a script and every number is regenerable.
# ============================================================================

seed: 20260903            # master RNG seed; all stochastic steps derive from it

paths:
  raw: data/raw
  processed: data/processed
  features: data/features
  results: results
  tables: tables
  figures: figures
  provenance: PROVENANCE.md
  dataset: data/processed/gelation_all.csv

# --- Standardisation (RDKit) -------------------------------------------------
standardize:
  largest_fragment: true    # keep the largest organic fragment (strip salts)
  neutralize: true          # neutralise charges where chemically sensible
  canonical: true           # canonical, isomeric SMILES as the dedup key
  isomeric: true            # keep stereochemistry in the canonical SMILES

# --- Cross-validation --------------------------------------------------------
cv:
  within_family:
    outer_splits: 5
    outer_repeats: 10       # repeated stratified 5x10 per family (RQ baseline)
  inner_splits: 5           # GridSearchCV inner folds (hyperparameters)
  select_k: 200             # SelectKBest univariate filter (fit INSIDE folds);
                            # clamped to n_features for low-dim representations
  clip: 1000000.0           # winsorize standardised features to +/- this, INSIDE
                            # folds; a float32-overflow guard for pathological
                            # descriptors (e.g. Ipc) in cross-family prediction
  min_family_size: 30       # families below this are reported but flagged
                            # "transfer numbers unreliable" (spec §12)

# --- Bootstrap / statistics --------------------------------------------------
stats:
  n_bootstrap: 2000         # bootstrap over MOLECULES (not folds) for CIs
  ci: 0.95

# --- Applicability domain ----------------------------------------------------
domain:
  leverage_multiplier: 3    # Williams threshold h* = leverage_multiplier * p / n
  fingerprint: ecfp4        # novelty = 1 - max Tanimoto to training set (ECFP4)
  ecfp_radius: 2            # ECFP4 == Morgan radius 2
  ecfp_nbits: 2048

# --- Feature representations -------------------------------------------------
features:
  morgan_radius: 2
  morgan_nbits: 2048
  rdkit2d: true
  mordred: true             # optional; skipped gracefully if it fails to import
  alvadesc: true            # loaded from data/features/alvadesc_<family>.csv if present

# --- Data sources ------------------------------------------------------------
# Every family's origin, licence, and curation parameters live here so nothing
# is hard-coded in a script. Curation writes the full record to PROVENANCE.md.
sources:

  nucleoside:
    kind: local_repo         # reused from the sibling reproduction repo
    repo_path: ../nucleoside-hydrogel-repro
    smiles_csv: "data/raw/upstream_repo/data/Original data/Smiles_data.csv"
    smiles_col: Chemdraw_smiles      # standardise the drawn SMILES uniformly
    id_col: ID
    label_col: "Hydrogel-forming ability"   # already binary 1/0
    alvadesc_export: data/interim/fresh_pull/alvadesc_export.csv
    citation: "Li W. et al., Nat. Commun. 15, 2603 (2024)"
    doi: "10.1038/s41467-024-46866-9"
    deposit: "github.com/leescu/NHGPM"
    licence: "CC BY 4.0 (article); Apache-2.0 (deposited code/data)"

  tripeptide:
    kind: peptide_ap         # sequence dict -> AP score in a .npy pickle
    url: "https://raw.githubusercontent.com/mnjirjak/ml_peptide_self_assembly/main/SA_ML_predictive/data/tripeptides_AP.npy"
    citation: "Frederix P.W.J.M. et al., Nat. Chem. 7, 30-37 (2015); AP values redeposited by Njirjak M. et al., Nat. Mach. Intell. 6, 1487 (2024)"
    doi_source: "10.1038/nchem.2122"
    doi_data: "10.5281/zenodo.13847868"
    licence: "MIT (data deposit)"
    ap_threshold: 1.5        # AP >= 1.5 -> self-assembling (strong aggregator)
    ap_threshold_sensitivity: [1.4, 1.6]
    subsample_n: 600         # seeded, label-stratified; full 8000 kept as raw

  peptide_expt:
    kind: peptide_seq_csv    # experimental self-assembly labels, one-letter seqs
    url: "https://raw.githubusercontent.com/mnjirjak/ml_peptide_self_assembly/main/SA_ML_predictive/data/data_SA.csv"
    sep: ";"
    seq_col: peptide_sequence
    label_col: peptide_label
    citation: "Njirjak M. et al., Nat. Mach. Intell. 6, 1487 (2024), experimental set compiled from the self-assembly literature"
    doi_data: "10.5281/zenodo.13847868"
    licence: "MIT (data deposit)"
